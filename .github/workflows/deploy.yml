name: Deploy to DigitalOcean Droplet

on:
    push:
        branches: ['master']

permissions:
    contents: read
    packages: write

jobs:
    verify:
        runs-on: ubuntu-latest

        services:
            # prisma TypedSQL introspects each query against a live db,
            # and the generated client is what typecheck, eslint and
            # vitest all compile against, so verification needs a real Postgres.
            # Running migrate deploy against a fresh DB also proves the migrations
            # apply cleanly and every sql file still matches the current schema.
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: cookhound_ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cookhound_ci?schema=public
            NEXT_PUBLIC_ENV: test

        steps:
            - name: Checkout source
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'yarn'

            - name: Install dependencies
              run: yarn install --immutable --inline-builds

            - name: Apply migrations to CI database
              run: yarn prisma migrate deploy

            - name: Generate Prisma client (incl. TypedSQL)
              run: yarn prisma generate --sql

            - name: Typecheck
              run: yarn typecheck

            - name: Unit tests
              run: yarn test

    deploy:
        needs: verify
        runs-on: ubuntu-latest

        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ${{ github.repository }}

        steps:
            - name: Checkout source
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'yarn'

            - name: Install dependencies
              run: yarn install --immutable --inline-builds

            - name: Log in to registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & push image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}:${{ github.sha }}
                      ghcr.io/${{ github.repository }}:latest
                  build-args: |
                      NEXT_PUBLIC_ENV=${{ secrets.NEXT_PUBLIC_ENV }}
                      NEXT_SHARP_PATH=${{ secrets.NEXT_SHARP_PATH }}
                      NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
                      NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}
                      NEXT_PUBLIC_ORIGIN=${{ secrets.NEXT_PUBLIC_ORIGIN }}
                      NEXT_PUBLIC_COOKIE_DOMAIN=${{ secrets.NEXT_PUBLIC_COOKIE_DOMAIN }}
                      NEXT_PUBLIC_CAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_CAPTCHA_SITE_KEY }}
                      NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
                      NEXT_PUBLIC_TYPESENSE_HOST=${{ secrets.NEXT_PUBLIC_TYPESENSE_HOST }}
                      NEXT_PUBLIC_TYPESENSE_PORT=${{ secrets.NEXT_PUBLIC_TYPESENSE_PORT }}
                      NEXT_PUBLIC_TYPESENSE_PROTOCOL=${{ secrets.NEXT_PUBLIC_TYPESENSE_PROTOCOL }}
                  secrets: |
                      DATABASE_URL=${{ secrets.DATABASE_URL }}
                      DB_SSL=${{ secrets.DB_SSL }}
                      REDIS_TTL=${{ secrets.REDIS_TTL }}
                      REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
                      REDIS_HOST=${{ secrets.REDIS_HOST }}
                      REDIS_PORT=${{ secrets.REDIS_PORT }}
                      SMTP_HOST=${{ secrets.SMTP_HOST }}
                      SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
                      SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
                      GOOGLE_LOGGING_CREDENTIALS_BASE64=${{ secrets.GOOGLE_LOGGING_CREDENTIALS_BASE64 }}
                      GOOGLE_STORAGE_CREDENTIALS_BASE64=${{ secrets.GOOGLE_STORAGE_CREDENTIALS_BASE64 }}
                      GOOGLE_GMAIL_CREDENTIALS_BASE64=${{ secrets.GOOGLE_GMAIL_CREDENTIALS_BASE64 }}
                      GOOGLE_API_PROJECT_ID=${{ secrets.GOOGLE_API_PROJECT_ID }}
                      GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
                      GOOGLE_OAUTH_REDIRECT_URI=${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
                      GOOGLE_STORAGE_BUCKET_RECIPE_IMAGES=${{ secrets.GOOGLE_STORAGE_BUCKET_RECIPE_IMAGES }}
                      GOOGLE_STORAGE_BUCKET_AVATAR_IMAGES=${{ secrets.GOOGLE_STORAGE_BUCKET_AVATAR_IMAGES }}
                      REVALIDATE_PATH_TOKEN=${{ secrets.REVALIDATE_PATH_TOKEN }}
                      TYPESENSE_API_KEY=${{ secrets.TYPESENSE_API_KEY }}
                      OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
                      ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
                      MAIL_DRIVER=${{ secrets.MAIL_DRIVER }}
                      CONTACT_EMAIL=${{ secrets.CONTACT_EMAIL }}
                      CAPTCHA_SECRET_KEY=${{ secrets.CAPTCHA_SECRET_KEY }}
                      NTFY_TOPIC=${{ secrets.NTFY_TOPIC }}
                      NTFY_URL=${{ secrets.NTFY_URL }}

            - name: Deploy on droplet
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              with:
                  host: ${{ secrets.DO_SSH_HOST }}
                  username: ${{ secrets.DO_SSH_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  port: 22
                  envs: GHCR_ACTOR,GHCR_TOKEN
                  script: |
                      set -e

                      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

                      if [ ! -d /cookhound/.git ]; then
                        git clone --depth=1 git@github.com:jaikeex/cookhound.git /cookhound
                      else
                        cd /cookhound && git fetch --depth=1 origin master && git reset --hard origin/master
                      fi

                      cd /cookhound
                      docker compose pull

                      # Post-deploy health gate: --wait blocks until every service is
                      # running and services with a healthcheck report healthy,
                      # so a bad startup fails the deploy loudly instead of silently leaving
                      # a broken image running. Only prune once health is confirmed. 

                      if ! docker compose up -d --remove-orphans --wait --wait-timeout 240; then
                        echo "ERROR: services did not become healthy in time." >&2
                        docker compose ps >&2 || true
                        docker compose logs --tail=80 web >&2 || true
                        exit 1
                      fi

                      docker image prune -af --filter "until=24h"
              env:
                  GHCR_ACTOR: ${{ github.actor }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    sync-nginx:
        needs: deploy
        runs-on: ubuntu-latest

        steps:
            - name: Sync nginx config on droplet
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              with:
                  host: ${{ secrets.DO_SSH_HOST }}
                  username: ${{ secrets.DO_SSH_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  port: 22
                  script: |
                      set -e

                      bash /cookhound/scripts/nginx-activate.sh \
                        /cookhound/deploy/nginx/nginx.conf \
                        /cookhound/deploy/nginx/cookhound.com.conf
