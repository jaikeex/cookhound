# =============================================================================
# Cookhound — site config
# Deployed to:  /etc/nginx/sites-available/cookhound.com
# =============================================================================

# --- HTTP: redirect everything to HTTPS, except the ACME challenge ----------
server {
    listen 80;
    server_name cookhound.com www.cookhound.com;

    # Only used to serve the ACME challenge below; every other request is
    # 301'd to HTTPS, so this document root is effectively unused otherwise.
    root /var/www/certbot;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name cookhound.com www.cookhound.com;

    # NOTE: this cert must cover BOTH cookhound.com and www.cookhound.com
    ssl_certificate /etc/letsencrypt/live/cookhound.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cookhound.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # With TLS 1.2 modern suites + TLS 1.3 only, letting the client pick is the
    # current recommendation (server preference buys nothing and can hurt
    # clients with hardware-accelerated cipher choices).
    ssl_prefer_server_ciphers off;

    #  HSTS: force HTTPS on subsequent visits. includeSubDomains extends the
    #  policy to every subdomain; preload opts into the browser preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Canonical host (optional): redirect www -> apex for SEO. Enable only once
    # the cert above is confirmed to cover www.cookhound.com.
    # if ($host = www.cookhound.com) {
    #     return 301 https://cookhound.com$request_uri;
    # }

    # proxy_headers_hash_* are inherited from the http {} block in nginx.conf.

    # ?============================================================================================
    #                                  CLIENT IP — ANTI-SPOOFING 
    # ?============================================================================================
    #
    #  The app trusts the LEFTMOST entry of X-Forwarded-For as the client IP. That is only safe 
    #  if nginx OVERWRITES the header with the real socket peer address and discards whatever the client sent.
    #  
    #  Correct form for a SINGLE internet-facing hop: overwrite
    #  with the socket peer address, unconditionally. No client value survives.
    #
    #  If a load balancer is ever placed IN FRONT of nginx, $remote_addr becomes
    #  the proxy's IP and this must change to trust that  proxy's XFF instead.
    #
    #  !! WARNING !!
    #  `proxy_set_header` is inherited into a location ONLY if that location
    #  declares no `proxy_set_header` of its own. ALL proxy_set_header
    #  directives for this vhost therefore live HERE at the server level.
    #  NEVER add a proxy_set_header inside a location below; doing so makes
    #  nginx silently drop every server-level header for that location,
    #  including the anti-spoofing overwrites, and the rate limiter / consent
    #  audit trail become spoofable again. Add new headers at THIS level.
    #
    # ?============================================================================================
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Image uploads: the app enforces 5MB per file (src/app/api/file/*), this
    # allows for multipart overhead. Everything else keeps the small global
    # ceiling from nginx.conf.
    location /api/file/ {
        client_max_body_size 16M;

        # 127.0.0.1 (not localhost): the app is loopback-bound on IPv4 only in
        # docker-compose.yml. "localhost" can resolve to ::1 first and fail.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
    }
}
