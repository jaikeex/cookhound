# =============================================================================
# Cookhound — global nginx config
# Deployed to:  /etc/nginx/nginx.conf
# =============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    # multi_accept on;
}

http {

    ##
    # Basic Settings
    ##

    proxy_headers_hash_bucket_size 64;
    proxy_headers_hash_max_size 1024;

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off; # do not leak the nginx version in headers/error pages

    # server_names_hash_bucket_size 64;
    # server_name_in_redirect off;

    # Global request-body ceiling — kept deliberately small. JSON endpoints
    # never need more (the app also enforces payload limits via readJson()),
    # and nginx buffers oversized bodies to disk BEFORE the app can reject
    # them, so a large global limit is free DoS surface. Image uploads get a
    # larger per-location limit in the site config (location /api/file/).
    client_max_body_size 2M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # WebSocket upgrade map
    ##
    # Sends "Connection: upgrade" only for real WebSocket requests and
    # "Connection: close" for ordinary requests, instead of hardcoding
    # "upgrade" on every proxied request (which harms upstream keep-alive).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ##
    # SSL Settings
    ##

    # TLS 1.0/1.1 are deprecated (RFC 8996) and insecure. Only 1.2/1.3.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Session resumption: skip the full handshake on repeat connections.
    # Tickets are disabled — the in-memory cache alone preserves forward
    # secrecy properties better across restarts.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ##
    # Logging Settings
    ##

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    ##
    # Gzip Settings
    ##
    gzip on;

    # Without gzip_types only text/html is compressed — the API's JSON and the
    # app's JS/CSS would go over the wire uncompressed. gzip_proxied is
    # required because every response here comes through proxy_pass.
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;

    ##
    # Virtual Host Configs
    ##

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
