enableScripts: true

nodeLinker: node-modules

# Supply-chain cooldown: never resolve a version published less than 7 days
# ago. Only affects resolution (yarn add / yarn up); installs from the
# committed lockfile are unaffected. Bypass once with --no-time-gate, or
# permanently per package via npmPreapprovedPackages.
npmMinimalAgeGate: 7d

npmRegistryServer: 'https://registry.yarnpkg.com'

yarnPath: .yarn/releases/yarn-4.18.0.cjs
